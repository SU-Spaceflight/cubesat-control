[package]
name = "cubesat-control"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3.34"
rand = { version = "0.10.3", features = ["chacha"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dependencies.opencv]
version = "0.101.1"
default-features = false
features = ["imgproc", "imgcodecs", "wechat_qrcode"]

[features]
default = []
save_debug_frames = []
old_cv = []

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
unreachable = "warn"
unimplemented = "warn"
unchecked_time_subtraction = "warn"
todo = "warn"
string_slice = "warn"
panic_in_result_fn = "warn"
panic = "warn"
exit = "warn"
as_conversions = "warn"
