[network]
ground_station_ip = "127.0.0.1"
telemetry_port = 8080

[hardware.pan_servo]
pin = 18
min_angle = -90.0
max_angle = 90.0
min_pulse_ms = 1
max_pulse_ms = 2

[hardware.tilt_servo]
pin = 19
min_angle = -90.0
max_angle = 90.0
min_pulse_ms = 1
max_pulse_ms = 2

[control.pan_servo]
kp = 0.02
ki = 0.001
kd = 0.005
integral_limit = 5.0

[control.tilt_servo]
kp = 0.02
ki = 0.001
kd = 0.005
integral_limit = 5.0

[control.camera]
width = 4608
height = 2592
fov = 120